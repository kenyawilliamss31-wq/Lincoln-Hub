name: Update campus data

on:
  schedule:
    # Runs every 30 minutes, 24/7 UTC
    # Scores appear within ~30 minutes of reaching Lincoln's feed
    - cron: "*/30 * * * *"

  # Manual trigger from the Actions tab for immediate testing
  workflow_dispatch:

# Concurrency: only one run at a time to prevent push conflicts
concurrency:
  group: update-campus-data
  cancel-in-progress: false

# Explicit permissions: only request what we need
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data from Lincoln feeds
        run: node scripts/build-data.mjs

      - name: Commit and push if anything changed
        run: |
          set -e

          # Configure git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage changes
          git add public-data

          # Check if there are any staged changes
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          # Create commit
          echo "Creating commit with data updates..."
          git commit -m "Update campus data from feeds"

          # Retry push logic for transient failures
          MAX_ATTEMPTS=5
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Push attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if git push origin HEAD:main; then
              echo "✓ Push succeeded."
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              WAIT_TIME=$((ATTEMPT * 15))
              echo "✗ Push failed. Retrying in ${WAIT_TIME}s..."
              sleep $WAIT_TIME
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "✗ Push failed after $MAX_ATTEMPTS attempts."
          exit 1
