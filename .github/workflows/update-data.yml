# Runs the data script on a schedule and commits whatever changed.
# GitHub Actions is free for public repositories.

name: Update campus data

on:
  schedule:
    # Cron format: minute hour day month weekday. Always UTC, never local time.
    # "*/30" in the minute field means "every 30 minutes", and the stars mean
    # "every" for the rest - so this runs all day, every day, twice an hour.
    # Scores show up within about half an hour of reaching Lincoln's feed.
    - cron: "*/30 * * * *"

  # Lets you press a button in the Actions tab to run it immediately, so you
  # never have to wait for the schedule.
  workflow_dispatch:

# By default a workflow can only read the repo. Writing the JSON back requires
# asking for write access explicitly.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest    # a fresh Linux machine GitHub provides free

    steps:
      # Downloads your repo onto that machine. Without this there are no files.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # the script uses built-in fetch, which needs 18+

      - name: Build data from Lincoln feeds
        run: node scripts/build-data.mjs

      - name: Commit if anything changed
        run: |
          # The commit needs an author. These are GitHub's official bot values.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data

          # --quiet --exit-code makes this command SUCCEED when nothing changed.
          # The || means "if that check fails, then commit" - so when there are
          # no new scores, the job finishes cleanly without an empty commit.
          git diff --staged --quiet || (git commit -m "Update campus data from feeds" && git push)
